<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shadi tag</title>
</head>
<body>
    <h1 align="center" cellpadding="10" cellspacing="5" >shadi registration form</h1>
    <form action="sucess.html">
        <table border="1" cellpadding="10" align="center" width="40%">
            <tr>
                <td>
                    <label for="name">name</label>
                    <input type="taxt" name="name" id="name" required>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="name">father name</label>
                    <input type="text" id="name" name="name" required>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="username">email/mobile</label>
                    <input type="text" name="username" id="username" required>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="gender">gender</label>
                    <label for="male">
                        <input type="radio" name="male" id="male">male
                    </label>
                    <label for="female">
                        <input type="radio" name="female" id="female">female
                    </label>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="birth date">birth date</label>
                    <input type="date" name="birth date" id="birth date" required>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="cast">cast</label>
                    <input type="text" name="cast" id="cast" required>
                </td>
            </tr>
            <tr>
                <td>
                    <button type="submit">submit</button>
                    <button type="reset">clear all</button>
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
