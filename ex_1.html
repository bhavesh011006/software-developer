<html>
    <head>
        <title>list tag</title>
    </head>
    <body>
        <h1>indian states</h1>
        <!--list of the indian states-->
        <ul type="circle">
            <li>gujarat</li> 
            <li>maharastra</li>
            <li>panjab</li>
            <li>hariyana</li>
            <li>rajastan</li>
            <ol type="I">
                <li>bhavnagar</li>
                <li>rajkot</li>
                <li>surat</li>
                <li>vadodara</li>
                <li>junagadh</li>
            </ol>
        </ul>
    </body>
</html>
